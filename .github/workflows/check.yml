name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node dist/bin.js setup --engine-only
      - run: npm test
      - run: npm run eval -- --simulate
      - run: npm run demo -- --no-browser --exit-at-end --every 0.01
